[/Script/baroCCTVSimulator.HucomsServerSubsystem]
; ============================================================================
; Hucoms CCTV 시뮬 서버 설정 (baroCCTVSimulator 플러그인, config=Game)
; - 값은 프로세스 시작 시 읽혀 월드 BeginPlay 에서 바인딩 — 리빌드 불필요, 재시작 필요.
; - 주석은 반드시 이렇게 별도 줄(; 시작)에 쓴다. 값 뒤 인라인 주석은 UE ini 규약이 아님
;   (주석까지 값으로 읽혀 문자열 항목이 깨진다).
; - 포트를 바꾸면 baro_calory config.json 의 devices[].port / mjpegPort 도 함께 바꿀 것.
; - 런치별 오버라이드(패키징 빌드 포함, ini 수정 없이):
;   -ini:Game:[/Script/baroCCTVSimulator.HucomsServerSubsystem]:BaseHttpPort=21031
; ============================================================================
; --- 포트 ---
; 카메라별 HTTP CGI 포트 자동부여 시작값. 첫 카메라 = Base+0 (8081, 8082, ...).
; 단, 카메라 액터의 HucomsHttpPort/HucomsMjpegPort 가 0(자동)일 때만 — >0 이면 그 값이 우선.
BaseHttpPort=8081
; 연속 MJPEG 스트림(TCP) 포트 자동부여 시작값 (8091, 8092, ...).
BaseMjpegPort=8091
; --- 광학 (cam-001 실측 캘리브레이션, 2026-07-14 재측정) ---
; wide(zoompos 0) 수평 FOV(deg). 옛 69.88 은 "픽셀↔각도는 선형"이라는 틀린 가정으로 역산된
; 값이라 22% 넓었다. 세로 FOV 상수는 없앴다 — rectilinear 광학에선 종횡비로 유도된다.
WideHFovDeg=57.14
; setcenter 초점거리 배율. 1.0 = 기하학적으로 정확한 카메라.
; 실기 펌웨어의 조준 오차(줌별 0.99~1.11, 망원 포화구간 0.75)를 일부러 재현하려면 그 값을 넣는다.
SetCenterFocalGain=1.0
; --- 모터 슬루 속도 ---
; Pan (centi-deg/s). 9000 = 90도/s.
PanSlewCdPerSec=9000
; Tilt (centi-deg/s).
TiltSlewCdPerSec=6000
; Zoom (raw tick/s).
ZoomSlewPerSec=30000
; --- Hucoms→UE 부호 매핑 (실기 정합 — 함부로 바꾸면 상하/좌우 반전) ---
PanToYawSign=1
TiltToPitchSign=-1
; --- 스냅샷(jpeg.cgi) 캡처 ---
; 해상도 QHD. 센터링 논리프레임(1920x1080)과 무관.
SnapshotWidth=2560
SnapshotHeight=1440
JpegQuality=92
; TSR 워밍업 프레임. 실측상 0(단발)이 가장 선명.
SnapshotWarmupFrames=0
; 노출 보정(EV). 뷰포트 톤 정합 실측 -0.7.
CaptureExposureBias=-0.7
; 캡처 대비. 코드 기본 1.6(뷰포트 정합값)은 흰 차+직사광에서 하이라이트 클리핑 1.9%/암부 12%로
; "탄" 세피아 톤(2026-07-02 실측). 1.2 = 클리핑 0.3%/암부 6.7%, 펀치 유지. 1.0 이 취향이면 이 값만 변경.
CaptureContrast=1.2
; --- 카메라 ---
; 레벨에 APTZCamera 가 없으면 기본 카메라 자동 생성(자율 검증용).
bAutoSpawnCameraIfNone=True
; --- BEVHeight 파인튜닝용 높이별 카메라(config 스포너, 레벨 무수정) ---
; 응용 SW팀 요구서(2026-07-23): 실장비 cam-real-002(16 m/23°/36-49 m) 대응 + 높이 일반화.
; 주차 중심 = (73.2, 182.5, z=10). 네 대를 중심 남쪽 22 m 지점(Y=-2015)에 '높이만' 8/12/16/20 m 로
; 쌓고, 각자 주차 중심을 조준하도록 PitchDeg 를 개별 지정(−atan(높이/2197)). 실측 검증된 클리어 사이트라인
; 위치다(cam_8083 스냅샷에서 주차행·차량·라인 전부 육안 확인).
;
; ⚠ 실장비의 16 m/20°/36-49 m 기하는 이 레벨에서 '클리어 사이트라인으로는' 재현 불가 —
;   20° 하향으로 44 m 를 떨어뜨리면 카메라가 단지 정원(잔디·담장·아파트동) 뒤로 들어가 주차장이 가려진다
;   (Y=-4213 배치 실측: 렌더가 잔디/건물, visibleRatio 0). 이 좁은 폐쇄형 주차장(~21×27 m)의 한계다.
;   따라서 '높이 다양성'을 우선 확보(틸트는 20~42°로 딸려 변함, 거리 슬랜트 ~23-40 m). 실장비의 원거리
;   저각 기하가 필수면 더 개방된 레벨이 필요(이교수님 판단) — ini 만 고치면 되고 리빌드 불필요.
;
; 포트 명시(자동포트는 열거순이라 비결정적): HTTP 8083~8086(8085·8086 은 DefaultEngine.ini 리스너 오버라이드),
; MJPEG 8193~8196(8095 씬 제어 포트 회피, 자체 0.0.0.0 바인딩).
+SpawnCameras=(Location=(X=73.2,Y=-2015.5,Z=800.0),YawDeg=90.0,PitchDeg=-20.0,HttpPort=8083,MjpegPort=8193,Note="8m")
+SpawnCameras=(Location=(X=73.2,Y=-2015.5,Z=1200.0),YawDeg=90.0,PitchDeg=-28.6,HttpPort=8084,MjpegPort=8194,Note="12m")
+SpawnCameras=(Location=(X=73.2,Y=-2015.5,Z=1600.0),YawDeg=90.0,PitchDeg=-36.1,HttpPort=8085,MjpegPort=8195,Note="16m")
+SpawnCameras=(Location=(X=73.2,Y=-2015.5,Z=2000.0),YawDeg=90.0,PitchDeg=-42.3,HttpPort=8086,MjpegPort=8196,Note="20m")
; --- 연속 MJPEG 스트림 ---
bEnableMjpegStream=True
; 스트림 fps. 코드 기본값 15 는 24fps 목표에 미달 — 30 으로 상향.
StreamFps=30
; 스트림 해상도(스냅샷과 별개, FOV 동일 유지 경량화).
StreamWidth=1280
StreamHeight=720
StreamJpegQuality=80
; 연속 스트림 캡처를 비동기 GPU 리드백으로(v0.1.10~). true=게임 스레드가 캡처마다 GPU 완료를
; 동기 대기하지 않음(실측 6대 26.8~432ms 블로킹 제거) + JPEG 인코딩 워커 스레드화. 품질 바이트
; 동일(같은 렌더), 스트림에 1~2프레임 레이턴시(CCTV 무해). false=0.1.9 동기 경로(롤백/비교).
; 스냅샷(jpeg.cgi)은 이 값과 무관하게 항상 동기.
bAsyncStreamCapture=True
; --- 렌더 자원 생명주기 ("쓰는 카메라만 켠다", 플러그인 v0.1.9~) ---
; 0.1.8 까지는 한 번이라도 캡처된 카메라가 종료까지 SceneCapture + persistent ViewState +
; 텍스처 시점 등록을 영구히 물고 있었다. 그래서 클라이언트 0 / 캡처 0 인 유휴 상태에서도
; 6대분 렌더 자원이 GPU 에 남아 1150 ms/frame(2.5 fps), VRAM 6.2/6.65 GB, RT 지오메트리
; 1.245 GiB(예산 400 MiB) 초과가 났다.
;
; 동시에 켜 둘 카메라 수. 실사용이 "한 번에 한 대씩 본다" 라 1 이 기본 —
; 새 카메라를 쓰면 직전 카메라는 그 자리에서 꺼진다.
; MJPEG 클라이언트가 붙어 있는 채널은 스트림이 끊기므로 축출 대상에서 제외된다.
; 0 = 상한 없음(레거시 0.1.8 동작).
MaxActiveCameras=1
; 축출 유예(초). 이 시간 안에 쓴 카메라는 위 상한 규칙으로 끄지 않는다.
; 없으면 6대를 번갈아 쓰는 소비자(DGX 검출기의 순회 폴링 등)에서 매 요청마다 껐다 켜는
; churn 이 나 오히려 더 무겁다(실측 2026-07-24: 1분에 173회 재생성).
; 사람이 카메라를 바꿔 보는 속도보다는 짧게 둬서 전환 시엔 즉시 꺼지게 한다.
MinWarmSeconds=5
; 마지막 사용 후 이 시간(초)이 지나고 MJPEG 클라이언트도 없으면 그 카메라도 끈다
; (아무도 안 볼 때 자원을 0 으로). 주의: 폴 간격이 이 값보다 긴 클라이언트는 매 요청마다
; 콜드 재생성된다(패키지 실측 약 3초 — 대부분 RecreateWarmupFrames) — warm 유지가
; 필요하면 폴 간격보다 크게 올릴 것. 0 = 시간 해제 안 함.
IdleReleaseSeconds=10
; 꺼져 있던 카메라가 다시 켜진 '첫 캡처'에만 추가로 줄 워밍업 프레임.
; 정상 상태의 SnapshotWarmupFrames=0(실측 최적)은 그대로 두고, 콜드 시작에서만
; Lumen/노출 히스토리가 프레임 0 이라 뜨는 것을 보정한다.
RecreateWarmupFrames=4

[/Script/baroCCTVSimulator.SceneControlSubsystem]
; ============================================================================
; 씬 제어 서버 (월드 전역 1포트, /scene/* REST — 주차면/차량/카메라 파라미터)
; baro_calory config.json 의 simulator.port 와 일치시킬 것.
; ============================================================================
; 씬 제어 HTTP 포트 (기본 8095).
ScenePort=8095
; 스폰할 차량 블루프린트 generated class 경로.
