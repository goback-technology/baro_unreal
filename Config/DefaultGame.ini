[/Script/baroCCTVSimulator.HucomsServerSubsystem]
; ============================================================================
; Hucoms CCTV 시뮬 서버 설정 (baroCCTVSimulator 플러그인, config=Game)
; - 값은 프로세스 시작 시 읽혀 월드 BeginPlay 에서 바인딩 — 리빌드 불필요, 재시작 필요.
; - 주석은 반드시 이렇게 별도 줄(; 시작)에 쓴다. 값 뒤 인라인 주석은 UE ini 규약이 아님
;   (주석까지 값으로 읽혀 문자열 항목이 깨진다).
; - 포트를 바꾸면 baro_calory config.json 의 devices[].port / mjpegPort 도 함께 바꿀 것.
; - 런치별 오버라이드(패키징 빌드 포함, ini 수정 없이):
;   -ini:Game:[/Script/baroCCTVSimulator.HucomsServerSubsystem]:BaseHttpPort=21031
; ============================================================================
; --- 포트 ---
; 카메라별 HTTP CGI 포트 자동부여 시작값. 첫 카메라 = Base+0 (8081, 8082, ...).
; 단, 카메라 액터의 HucomsHttpPort/HucomsMjpegPort 가 0(자동)일 때만 — >0 이면 그 값이 우선.
BaseHttpPort=8081
; 연속 MJPEG 스트림(TCP) 포트 자동부여 시작값 (8091, 8092, ...).
BaseMjpegPort=8091
; --- 광학 (cam-001 실측 캘리브레이션, 2026-07-14 재측정) ---
; wide(zoompos 0) 수평 FOV(deg). 옛 69.88 은 "픽셀↔각도는 선형"이라는 틀린 가정으로 역산된
; 값이라 22% 넓었다. 세로 FOV 상수는 없앴다 — rectilinear 광학에선 종횡비로 유도된다.
WideHFovDeg=57.14
; setcenter 초점거리 배율. 1.0 = 기하학적으로 정확한 카메라.
; 실기 펌웨어의 조준 오차(줌별 0.99~1.11, 망원 포화구간 0.75)를 일부러 재현하려면 그 값을 넣는다.
SetCenterFocalGain=1.0
; --- 모터 슬루 속도 ---
; Pan (centi-deg/s). 9000 = 90도/s.
PanSlewCdPerSec=9000
; Tilt (centi-deg/s).
TiltSlewCdPerSec=6000
; Zoom (raw tick/s).
ZoomSlewPerSec=30000
; --- Hucoms→UE 부호 매핑 (실기 정합 — 함부로 바꾸면 상하/좌우 반전) ---
PanToYawSign=1
TiltToPitchSign=-1
; --- 스냅샷(jpeg.cgi) 캡처 ---
; 해상도 QHD. 센터링 논리프레임(1920x1080)과 무관.
SnapshotWidth=2560
SnapshotHeight=1440
JpegQuality=92
; TSR 워밍업 프레임. 실측상 0(단발)이 가장 선명.
SnapshotWarmupFrames=0
; 노출 보정(EV). 뷰포트 톤 정합 실측 -0.7.
CaptureExposureBias=-0.7
; 캡처 대비. 코드 기본 1.6(뷰포트 정합값)은 흰 차+직사광에서 하이라이트 클리핑 1.9%/암부 12%로
; "탄" 세피아 톤(2026-07-02 실측). 1.2 = 클리핑 0.3%/암부 6.7%, 펀치 유지. 1.0 이 취향이면 이 값만 변경.
CaptureContrast=1.2
; --- 카메라 ---
; 레벨에 APTZCamera 가 없으면 기본 카메라 자동 생성(자율 검증용).
bAutoSpawnCameraIfNone=True
; --- 연속 MJPEG 스트림 ---
bEnableMjpegStream=True
; 스트림 fps. 코드 기본값 15 는 24fps 목표에 미달 — 30 으로 상향.
StreamFps=30
; 스트림 해상도(스냅샷과 별개, FOV 동일 유지 경량화).
StreamWidth=1280
StreamHeight=720
StreamJpegQuality=80

[/Script/baroCCTVSimulator.SceneControlSubsystem]
; ============================================================================
; 씬 제어 서버 (월드 전역 1포트, /scene/* REST — 주차면/차량/카메라 파라미터)
; baro_calory config.json 의 simulator.port 와 일치시킬 것.
; ============================================================================
; 씬 제어 HTTP 포트 (기본 8095).
ScenePort=8095
; 스폰할 차량 블루프린트 generated class 경로.
CarBlueprintPath=/Game/BP/BP_Car.BP_Car_C
; 주차면 액터 클래스명 접두(BP_ParkingSlot_5m/6m/BUS/... 공통).
ParkingSlotClassPrefix=BP_ParkingSlot

