[HTTPServer.Listeners]
; 원격 배포(gb_210 등)에서 다른 호스트의 baro_calory 가 제어하도록, 시뮬레이터 포트만 전 인터페이스 바인딩.
; Hucoms CGI(8081~8084)·씬 제어(8095)는 FHttpServerModule 리스너라 포트별 오버라이드로 지정한다.
; 전역 DefaultBindAddress=any 를 쓰지 않는 이유: 에디터 MCP(:8000)도 같은 모듈이라 LAN 노출됨.
; MJPEG(8091+)는 자체 FTcpListener 로 이미 0.0.0.0.
+ListenerOverrides=(Port=8081,BindAddress=any)
+ListenerOverrides=(Port=8082,BindAddress=any)
+ListenerOverrides=(Port=8083,BindAddress=any)
+ListenerOverrides=(Port=8084,BindAddress=any)
; BEVHeight 파인튜닝용 높이별 카메라(config 스포너) HTTP CGI 포트 (8083/8084 는 위에 이미 있음).
+ListenerOverrides=(Port=8085,BindAddress=any)
+ListenerOverrides=(Port=8086,BindAddress=any)
+ListenerOverrides=(Port=8095,BindAddress=any)
