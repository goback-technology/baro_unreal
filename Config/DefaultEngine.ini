[SystemSettings]
; RT 지오메트리 상주 풀. 엔진 기본 400MB 인데 주차장 씬은 1.4GiB 를 요구해 매 프레임
; 축출->재요청->BLAS 재빌드 churn 이 돌았고, 이것이 SceneCapture 지연을 밀어올려 MJPEG
; 스트림이 30 대신 10~20fps 로 떨어졌다(캡처 페이싱이 Interval 배수로 계단 양자화되는
; 구조라 지연 악화가 3배 절벽으로 증폭됨 — HucomsServerSubsystem.cpp 참조).
; 실측(2026-07-29, RTX 5060 8GB, 패키지): 400MB=20fps -> 1600MB=30.0fps 정상화,
; VRAM 6.5/8.1GB. 씬이 더 커져 HUD 에 RAY TRACING ... OVER BUDGET 이 다시 뜨면 상향.
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=1600

