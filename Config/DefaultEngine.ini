[HTTPServer.Listeners]
; 시뮬레이터 포트(Hucoms CGI·씬 제어)의 전 인터페이스 바인딩은 **코드가 선언한다** —
; 리스너를 여는 곳이 자기 포트만 BindAddress=any 로 연다(플러그인 `HttpListenerBind.h`).
; 런타임에 정해지는 포트(POST /scene/cameras 스폰)는 이 파일에 미리 적을 수 없으므로 목록 방식은 쓰지 않는다.
; 전역 DefaultBindAddress=any 는 쓰지 않는다: 같은 모듈을 쓰는 에디터 MCP(:8000)까지 LAN 에 노출된다.
; MJPEG(8091+)는 자체 FTcpListener 로 이미 0.0.0.0.
; 특정 NIC 에 고정할 때만 아래처럼 명시한다 — 코드는 이미 지정된 포트를 덮지 않는다.
;   +ListenerOverrides=(Port=8081,BindAddress=192.168.0.211)
