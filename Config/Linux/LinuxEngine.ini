; Linux(Vulkan) 타깃 전용 오버라이드. (2026-07-09 주차라인 데칼 미렌더 조사)
;
; 엔진 기본(BaseLinuxEngine.ini)은 VULKAN_SM6 에 BindlessConfiguration=All 을 강제한다
; ("Bindless is necessary for Vulkan ray tracing"). 이 프로젝트는 레이트레이싱을 쓰지 않으며,
; bindless(VK_EXT_descriptor_buffer) 전면 적용 상태에서 버추얼 텍스처(VT) 시스템이 동작하지 않아
; SVT 를 샘플링하는 데칼(주차면 라인 MI_Decal_Line_Road_White_02, Megascans _VT 계열)이
; 투명하게 렌더되는 문제가 있었다. D3D12(Windows)와 동일하게 RayTracing 한정으로 낮춘다.
[ShaderPlatformConfig VULKAN_SM6]
BindlessConfiguration=RayTracing
