<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Background (Pure Dark) -->
  <rect x="0" y="0" width="1000" height="1000" fill="#0a0e17" />

  <!-- ========================================== -->
  <!-- 1. CONCENTRIC MAGIC RINGS (원안 동심원 림) -->
  <!-- ========================================== -->
  <g id="layer-rings">
    <circle cx="500" cy="500" r="460" fill="none" stroke="#00f0ff" stroke-width="2.5" />
    <circle cx="500" cy="500" r="445" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="2,8" />
    <circle cx="500" cy="500" r="430" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="500" cy="500" r="415" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="500" cy="500" r="380" fill="none" stroke="#00f0ff" stroke-width="2" />
    <circle cx="500" cy="500" r="235" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="500" cy="500" r="145" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="500" cy="500" r="55" fill="none" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- ========================================== -->
  <!-- 2. RADIAL AXES & GEOMETRY GRID (원안 그리드) -->
  <!-- ========================================== -->
  <g id="layer-grid">
    <line x1="500" y1="50" x2="500" y2="950" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="50" y1="500" x2="950" y2="500" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="183.7" y1="69.1" x2="816.3" y2="930.9" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="816.3" y1="69.1" x2="183.7" y2="930.9" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="62.1" y1="376.4" x2="937.9" y2="623.6" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="937.9" y1="376.4" x2="62.1" y2="623.6" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- ========================================== -->
  <!-- 3. OUTER INVERTED PENTAGRAM (역 펜타그램) -->
  <!-- ========================================== -->
  <g id="layer-inverted">
    <!-- Inverted Outer Frame -->
    <polygon points="500,880 138.8,617.4 276.6,192.6 723.4,192.6 861.2,617.4" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,6" />
    <!-- Inverted Star -->
    <polygon points="500,880 276.6,192.6 861.2,617.4 138.8,617.4 723.4,192.6" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- 5 Tip Nodes -->
    <circle cx="500" cy="880" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="138.8" cy="617.4" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="276.6" cy="192.6" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="723.4" cy="192.6" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="861.2" cy="617.4" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- ========================================== -->
  <!-- 4. INNER UPRIGHT PENTAGRAM (정 펜타그램) -->
  <!-- ========================================== -->
  <g id="layer-upright">
    <!-- Upright Outer Frame -->
    <polygon points="500,265 723.5,427.4 638.1,689.9 361.9,689.9 276.5,427.4" fill="none" stroke="#0284c7" stroke-width="1.5" />
    <!-- Upright Star -->
    <polygon points="500,265 638.1,689.9 276.5,427.4 723.5,427.4 361.9,689.9" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- 5 Tip Nodes -->
    <circle cx="500" cy="265" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="723.5" cy="427.4" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="638.1" cy="689.9" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="361.9" cy="689.9" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="276.5" cy="427.4" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- ========================================== -->
  <!-- 5. CORE HARMONY (중심 코어 스타 & 싱귤래리티) -->
  <!-- ========================================== -->
  <g id="layer-core">
    <polygon points="500,590 447.1,426.9 585.6,527.6 414.4,527.6 552.9,426.9" fill="none" stroke="#f59e0b" stroke-width="1.8" opacity="0.85" />
    <circle cx="500" cy="500" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,4" />
    <circle cx="500" cy="500" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="500" cy="500" r="6" fill="#00f0ff" />
    <circle cx="500" cy="500" r="2" fill="#ffffff" />
  </g>
</svg>
